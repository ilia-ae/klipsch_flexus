version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Pinned exactly by pytest-homeassistant-custom-component; bumping them
      # on their own can never resolve.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "homeassistant"
