# Dependabot PRs are not owner-signed and carry no local CI evidence, so the
# advisory "Verify signed local CI (advisory)" run fails on them and the commit
# status local-ci/verified is missing until the owner reads the bump and runs
# make ci-pr PR=<n> CONFIRM=1 (builds the PR's own venvs, tests the PR head
# locally, signs and publishes the evidence, dispatches verification). Merge
# them with a signed commit (docs/TESTING.md, "Local CI and signed evidence").
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      # Pinned exactly by pytest-homeassistant-custom-component; bumping them
      # on their own can never resolve.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "homeassistant"
