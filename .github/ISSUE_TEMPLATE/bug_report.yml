name: Bug report
description: Something in the Klipsch Flexus integration does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check [Troubleshooting](https://github.com/ilia-ae/klipsch_flexus#troubleshooting) first.
        Questions go to [Discussions](https://github.com/ilia-ae/klipsch_flexus/discussions).
        Report security problems privately, see [SECURITY.md](https://github.com/ilia-ae/klipsch_flexus/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Integration version
      description: Shown in HACS, or under Settings > Devices & Services > Klipsch Flexus.
      placeholder: "2.5.21"
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      description: Beta versions are pre-releases tagged vX.Y.Z-beta.N.
      options:
        - stable
        - beta
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings > About.
      placeholder: "2026.10.4"
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Soundbar model
      options:
        - CORE 100
        - CORE 200
        - CORE 300
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Soundbar firmware version
      description: >-
        The device version in the Klipsch Connect Plus app (1.1.3.x on the 2026
        firmware).
      placeholder: "1.1.3.0x7cd294e"
    validations:
      required: true

  - type: input
    id: cast_build
    attributes:
      label: Google Cast build (optional)
      description: >-
        "Firmware" on the device page in Home Assistant. This is the Google Cast
        build, not the device version above.
      placeholder: "20250512_0201_RC25"

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: What did you do? What did you expect? What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Settings > System > Logs. Copy the lines that mention klipsch_flexus.
      render: shell

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings > Devices & Services > Klipsch Flexus > ⋮ > Download diagnostics. Paste the JSON here.
        The integration redacts the IP address, every MAC address (including the signing MAC and its candidates),
        the Wi-Fi BSSID, the device ID and stream URLs. The file never contains a signed request header.
        Read it before you post it anyway.
      render: json
