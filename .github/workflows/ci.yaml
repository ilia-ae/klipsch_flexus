name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          version: "0.17.2"
          args: "check custom_components/klipsch_flexus tools tests"
      - uses: astral-sh/ruff-action@v4
        with:
          version: "0.17.2"
          args: "format --check custom_components/klipsch_flexus tools tests"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current Home Assistant (pinned; Dependabot bumps the pin).
          - name: latest
            python-version: "3.14"
            requirements: requirements_test.txt
          # Oldest Home Assistant we claim to support (hacs.json "homeassistant").
          - name: minimum
            python-version: "3.12"
            requirements: .github/ci/requirements_test_min.txt
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: ${{ matrix.requirements }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: pytest tests/ -v
