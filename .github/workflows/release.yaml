# A release is published only for a signed annotated tag (git tag -s, made by
# make release-tag) whose commit is owner-signed and carries verified signed
# local CI evidence (refs/notes/local-ci). Tests ran on the owner's Mac; this
# workflow only verifies (scripts/verify_local_ci.py) and publishes the release
# HACS installs from.
#
# Tags: vX.Y.Z (stable: a normal release, marked Latest) or vX.Y.Z-beta.N
# (beta: a GitHub pre-release, never Latest; HACS offers it only to users who
# enable "Show beta versions" for this repository). Any other tag is refused.
# The tag must equal "v" + the manifest.json version.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Tag format and manifest version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag is vX.Y.Z or vX.Y.Z-beta.N and matches the manifest version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' refused: release tags are vX.Y.Z (stable) or vX.Y.Z-beta.N (beta pre-release)"
            exit 1
          fi
          manifest="$(jq -r .version custom_components/klipsch_flexus/manifest.json)"
          if [ "$TAG" != "v$manifest" ]; then
            echo "::error::Tag $TAG does not match manifest version $manifest (expected tag v$manifest)"
            exit 1
          fi
          if [[ "$TAG" == *-beta.* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "$TAG: prerelease=$prerelease"

  verify:
    name: Verify signed tag and signed local CI
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --no-tags --force --quiet origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Exercise the verifier (accept and every reject path, throwaway keys)
        run: python3 -I scripts/test_local_ci.py

      - name: Verify tag signature, commit signature and signed local CI evidence
        env:
          LOCAL_CI_ALLOWED_SIGNERS: ${{ vars.LOCAL_CI_ALLOWED_SIGNERS }}
          TAG: ${{ github.ref_name }}
        run: |
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! python3 -I scripts/verify_local_ci.py --sha "$sha" --tag "$TAG" --fetch origin --wait 180; then
            echo "::error::release ${TAG} refused: it needs a signed annotated tag (make release-tag) on an owner-signed commit with signed local CI evidence (make ci && make ci-publish)"
            exit 1
          fi

  release:
    name: Publish the GitHub release
    needs: [version, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A beta is a pre-release and must not become Latest: HACS installs the
      # latest stable release for everyone who has not enabled beta versions.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
