# minimum: the oldest Home Assistant the integration supports (2024.11.0, the HA of
# .github/ci/requirements_test_min.txt). Fresh HACS-like install of this checkout + restart, then
# the config flow against the fake soundbar must reach "loaded" with the stub's entities and states,
# service calls reach the stub, and no error/traceback is logged. No brand-image check: Home
# Assistant < 2026.3 has no local brands (it uses the brands CDN). Test-only. Run from the
# repository root (one scenario at a time, the Docker VM is shared):
#   make molecule-scenarios SCENARIOS=klipsch_flexus_install/minimum
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  # "klipsch-flexus-" = this repository (the Docker daemon is shared; cleanup only touches these).
  - name: klipsch-flexus-minimum
    # Official image, pinned by its multi-arch index (linux/amd64 + linux/arm64); Docker runs the
    # host's architecture natively (arm64 on the owner's Mac, amd64 on CI runners).
    image: ghcr.io/home-assistant/home-assistant:2024.11.0@sha256:0f357468558aa24858af7470f5942ae740d8472d892e7838111ee0f71110e78b
    pre_build_image: true
    # Keep the image's ENTRYPOINT (/init, s6-overlay): Home Assistant runs as an s6 service.
    override_command: false
    env:
      TZ: UTC
    # An internal network: no route to the internet or to any LAN host. Home Assistant only talks
    # to itself and to the stub on loopback.
    docker_networks:
      - name: klipsch-flexus-minimum
        internal: true
    networks:
      - name: klipsch-flexus-minimum
provisioner:
  name: ansible
  inventory:
    host_vars:
      klipsch-flexus-minimum:
        ansible_connection: community.docker.docker_api
        ansible_docker_timeout: 60
        ansible_python_interpreter: /usr/local/bin/python3
ansible:
  cfg:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/../../collections
      interpreter_python: auto_silent
      stdout_callback: ansible.builtin.default
      callback_result_format: yaml
    connection:
      pipelining: true
  env:
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections"
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    PYTHONDONTWRITEBYTECODE: "1"
    # macOS: Python HTTP clients in forked Ansible workers (docker_api connection) crash in the
    # system proxy lookup unless these are set. No effect on Linux.
    no_proxy: "*"
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
