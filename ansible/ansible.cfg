# Ansible configuration of the Molecule harness (test-only).
# There is intentionally NO inventory here: the only hosts are the Molecule containers that each
# scenario's molecule.yml defines. Nothing in this repository targets a real Home Assistant; users
# (and the owner) install and update the integration through HACS.
[defaults]
roles_path = ./roles
collections_path = ./collections
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
nocows = True

[connection]
pipelining = True
